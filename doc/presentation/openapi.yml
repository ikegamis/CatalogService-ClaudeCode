openapi: 3.1.0
info:
  title: CatalogService-Sample
  version: 1.0.0
  description: 書籍「つくりながら学ぶ！ドメイン駆動設計入門」のAPI仕様
paths:
  /book/{isbn}/recommendations:
    get:
      summary: 中核ユースケース - 推薦書籍タイトルの取得
      description: 中核ユースケース - レビュー内容から推薦書籍を取得
      operationId: getRecommendations
      parameters:
        - name: isbn
          in: path
          required: true
          description: BookId(ISBN)
          schema:
            type: string
        - name: threshold
          in: query
          required: false
          description: レビュー信頼性の閾値（0 以上 1.0 以下）。省略時は既定値 0.6
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - recommendedBooks
                properties:
                  ok:
                    type: boolean
                  recommendedBooks:
                    type: array
                    description: 言及頻度順の推薦書籍名
                    items:
                      type: string
        '500':
          description: 失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FalseMessage'
  /book:
    post:
      summary: 書籍登録
      description: 新しい書籍情報を登録する
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '201':
          description: 正常に登録されました
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - book
                properties:
                  ok:
                    type: boolean
                  book:
                    $ref: '#/components/schemas/Book'
        '500':
          description: 登録に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FalseMessage'
  /review:
    post:
      summary: レビュー投稿
      description: リクエストボディの bookId の書籍に対するレビュー投稿
      operationId: postReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: 正常に登録されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OKReview'
        '500':
          description: 登録に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FalseMessage'
  /review/{id}:
    put:
      summary: レビュー更新
      description: レビューID以外の入力情報でレビューを更新する
      operationId: putReview
      parameters:
        - name: id
          in: path
          required: true
          description: レビューID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: 正常に更新されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OKReview'
        '500':
          description: 更新に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FalseMessage'
    delete:
      summary: レビュー削除
      operationId: deleteReview
      parameters:
        - name: id
          in: path
          required: true
          description: レビューID
          schema:
            type: string
      responses:
        '200':
          description: 正常に削除されました
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - message
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                    description: "'{レビューID}' は削除されました"
        '500':
          description: 削除に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FalseMessage'

# 構造体定義
components:
  schemas:
    Book:
      type: object
      required:
        - isbn
        - title
        - author
        - price
      properties:
        isbn:
          type: string
          description: 国際標準図書番号（13文字。例 "9784000000000"）
        title:
          type: string
          description: 書籍のタイトル
        author:
          type: string
          description: 著者名
        price:
          type: integer
          description: 価格（円）
    FalseMessage:
      type: object
      required:
        - ok
        - message
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: エラー理由
    ReviewRequest:
      type: object
      description: レビューの登録・更新リクエスト
      required:
        - bookId
        - rating
      properties:
        bookId:
          type: string
          description: Book オブジェクトのID(ISBN)
        name:
          type: [string, "null"]
          description: 投稿者名。省略または null の場合は匿名投稿として「名無し」とする
        rating:
          type: integer
          description: 評価（1〜5）
        comment:
          type: [string, "null"]
          description: レビューのコメント。省略または null の場合はコメントなし
    Review:
      type: object
      required:
        - id
        - bookId
        - name
        - rating
        - comment
      properties:
        id:
          type: string
          description: レビューID
        bookId:
          type: string
          description: Book オブジェクトのID(ISBN)
        name:
          type: string
          description: 投稿者名
        rating:
          type: integer
          description: 評価（1〜5）
        comment:
          type: [string, "null"]
          description: レビューのコメント
    OKReview:
      type: object
      required:
        - ok
        - review
      properties:
        ok:
          type: boolean
        review:
          $ref: '#/components/schemas/Review'
